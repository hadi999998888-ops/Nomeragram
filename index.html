<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Автономера</title>
<style>
:root{--bg:#050505;--glass:rgba(255,255,255,.045);--ink:#f4f4f4;--mut:#8a8a8a;--line:rgba(255,255,255,.1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at 50% -10%,rgba(255,255,255,.1),transparent 50%),linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:auto,34px 34px,34px 34px}
button{font-family:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 50px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;text-transform:uppercase;letter-spacing:1.5px;flex:1;min-width:0}
.logo span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#fff,#aaa);color:#000;display:grid;place-items:center;flex:none;box-shadow:0 0 18px rgba(255,255,255,.25)}
.ib{height:38px;min-width:38px;padding:0 11px;border-radius:11px;border:1px solid var(--line);background:var(--glass);display:flex;gap:6px;align-items:center;justify-content:center;font-weight:800;font-size:12px;letter-spacing:.5px;text-transform:uppercase;transition:.15s;flex:none}
.ib:hover{border-color:#fff}.ib:active{transform:scale(.92)}
.bal{position:relative;display:flex;align-items:center;gap:7px;background:linear-gradient(145deg,#fff,#c4c4c4);color:#000;padding:0 14px;height:38px;border-radius:11px;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;flex:none}
.bal.pulse{animation:bp .4s}
@keyframes bp{40%{transform:scale(1.12)}}
.fl{position:absolute;right:4px;top:-8px;font-weight:900;font-size:14px;pointer-events:none;animation:fl 1s forwards;color:#fff;background:#000;border:1px solid #fff;padding:1px 7px;border-radius:8px;z-index:9}
@keyframes fl{to{transform:translateY(-34px);opacity:0}}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px;backdrop-filter:blur(8px)}
.card h2{margin:0 0 4px;font-size:22px;text-transform:uppercase;letter-spacing:1px}
.card p{margin:0 0 16px;color:var(--mut);font-size:14px}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.rb{padding:12px 6px 10px;border-radius:14px;border:1px solid var(--line);background:var(--glass);display:flex;flex-direction:column;align-items:center;gap:7px;transition:.18s;animation:dr .45s cubic-bezier(.3,1.5,.5,1) both}
.rb b{background:linear-gradient(#fff,#dcdcdc);color:#111;border:2px solid #111;box-shadow:0 0 0 1.5px #fff;border-radius:6px;padding:3px 10px;font:700 24px "Arial Narrow",Arial,sans-serif;letter-spacing:1px}
.rb span{font-size:11px;color:var(--mut);text-align:center;line-height:1.15}
.rb:hover{transform:translateY(-4px);border-color:#fff;box-shadow:0 10px 24px rgba(255,255,255,.12)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.tab{padding:11px 4px;border-radius:10px;border:0;background:none;color:var(--mut);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.6px;display:flex;gap:6px;align-items:center;justify-content:center;transition:.2s}
.tab.on{background:#fff;color:#000;box-shadow:0 4px 16px rgba(255,255,255,.2)}
.tab em{font-style:normal;background:rgba(128,128,128,.35);padding:1px 7px;border-radius:99px;font-size:11px}
.rec{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scrollbar-width:none;min-height:44px;align-items:center}
.rec::-webkit-scrollbar{display:none}
.rec .lb{flex:none;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;writing-mode:vertical-rl;transform:rotate(180deg)}
.rc{flex:none;position:relative;padding:5px 5px 8px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--line);animation:dr .35s both}
.rc::after{content:"";position:absolute;left:6px;right:6px;bottom:3px;height:2px;border-radius:2px;background:var(--rc)}
.stage{--amb:.06;position:relative;min-height:300px;border-radius:22px;margin-top:8px;background:linear-gradient(#0d0d0d,#030303);padding:22px 10px 14px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:1px solid #2c2c2c;box-shadow:inset 0 0 60px rgba(0,0,0,.8),0 20px 50px rgba(0,0,0,.5)}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 15%,rgba(255,255,255,calc(var(--amb) + .1)),transparent 60%);transition:background .6s;pointer-events:none}
.stage::after{content:"";position:absolute;left:-30%;right:-30%;bottom:-10px;height:45%;background-image:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px);background-size:36px 36px;transform:perspective(220px) rotateX(62deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000);pointer-events:none}
.stage>*{position:relative;z-index:2}
.stage.shake{animation:sk .5s}
@keyframes sk{10%,50%,90%{transform:translate(-4px,2px)}30%,70%{transform:translate(4px,-2px)}}
.idle{color:#8a8a8a;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;line-height:1.4}
.idle svg{width:58px;height:58px;opacity:.55;animation:fy 3s ease-in-out infinite}
@keyframes fy{50%{transform:translateY(-6px)}}
.slots{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center}
.slot{display:flex;flex-direction:column;align-items:center;gap:9px;width:100%}
.reelw{position:relative;width:100%;height:92px;overflow:hidden;border-radius:14px;background:#070707;border:1px solid #333;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.reelw::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 12px #fff;z-index:3}
.reelw::before{content:"";position:absolute;left:50%;top:0;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;z-index:3}
.reel{display:flex;height:100%;will-change:transform}
.it{flex:0 0 180px;display:flex;align-items:center;justify-content:center;position:relative;border-left:1px solid rgba(255,255,255,.05);transition:transform .3s}
.it::after{content:"";position:absolute;left:14px;right:14px;bottom:7px;height:3px;border-radius:3px;background:var(--rc)}
.it.win{transform:scale(1.14)}
.r0{--rc:#3d3d3d}.r1{--rc:#777}.r2{--rc:#bbb}.r3,.r4,.r5{--rc:#fff}
.it.r4::after,.it.r5::after{box-shadow:0 0 10px #fff}
.res{display:flex;flex-direction:column;align-items:center;gap:9px;animation:dr .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes dr{from{transform:translateY(-30px) scale(.75);opacity:0}}
.pw{position:relative;padding:5px;border-radius:16px;overflow:hidden;max-width:100%;filter:drop-shadow(0 12px 10px rgba(0,0,0,.7))}
.pw>.plate{position:relative;z-index:1}
.plate{--fs:30px;display:inline-flex;align-items:stretch;background:linear-gradient(#fff,#e2e2e2);color:#111;border:3px solid #111;border-radius:10px;box-shadow:inset 0 0 0 2px #f4f4f4,inset 0 0 0 3.5px #111;font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif;font-weight:700;overflow:hidden;position:relative;max-width:100%;text-shadow:1px 1px 0 rgba(255,255,255,.8),-1px -1px 0 rgba(0,0,0,.15)}
.plate.big{--fs:clamp(30px,9.5vw,54px)}
.plate.sm{--fs:19px}.plate.xs{--fs:12px;border-width:2px;border-radius:6px;box-shadow:none}
.plate::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 7px 50%,#777 0 2px,transparent 2.5px)}
.plate.xs::before{display:none}
.main{display:flex;align-items:center;padding:6px 12px 6px 16px;font-size:var(--fs);line-height:1;letter-spacing:1px;white-space:pre}
.xs .main{padding:3px 6px}.xs .reg{padding:2px 5px;border-left-width:2px}
.reg{display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:3px solid currentColor;padding:4px 10px;min-width:calc(var(--fs)*1.7)}
.rn{display:flex;font-size:calc(var(--fs)*.9);line-height:1}
.cc{font-size:calc(var(--fs)*.38);letter-spacing:1px}
.ch{display:inline-block;min-width:.55em;text-align:center}
.plate::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.9) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none;mix-blend-mode:overlay}
.slot.r2 .plate::after{animation:sw 1.2s .3s 1}
.slot.r3 .plate::after,.slot.r4 .plate::after,.slot.r5 .plate::after,.gi.r3 .plate::after,.gi.r4 .plate::after,.gi.r5 .plate::after{animation:sw 2.2s infinite}
@keyframes sw{to{transform:translateX(120%)}}
.slot.r1 .pw,.gi.r1 .pw{box-shadow:0 0 0 1px #777}
.slot.r2 .pw,.gi.r2 .pw{box-shadow:0 0 16px #bbb}
.slot.r3 .pw,.gi.r3 .pw{box-shadow:0 0 26px #fff}
.slot.r4 .pw,.slot.r5 .pw,.gi.r4 .pw,.gi.r5 .pw{box-shadow:0 0 36px #fff}
.slot.r4 .pw::before,.slot.r5 .pw::before,.gi.r4 .pw::before,.gi.r5 .pw::before{content:"";position:absolute;inset:-80%;background:conic-gradient(#000,#fff,#666,#fff,#000,#aaa,#000);animation:rot 2.4s linear infinite}
.slot.r5 .pw::before,.gi.r5 .pw::before{animation-duration:1.1s}
.slot.r5 .pw{animation:pu 1s infinite alternate}
@keyframes rot{to{transform:rotate(1turn)}}
@keyframes pu{to{box-shadow:0 0 64px #fff}}
.slot.r5 .plate,.gi.r5 .plate{background:linear-gradient(#141414,#050505);color:#fafafa;border-color:#fafafa;box-shadow:inset 0 0 0 2px #0b0b0b,inset 0 0 0 3.5px #fafafa;text-shadow:0 0 8px rgba(255,255,255,.6)}
.pill{display:inline-flex;gap:5px;align-items:center;padding:4px 11px;border-radius:999px;font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:1.3px;border:1px solid #777;color:#aaa}
.p1{background:#444;color:#fff;border-color:#444}.p2{background:#bbb;color:#000;border-color:#bbb}.p3{background:#fff;color:#000;border-color:#fff}
.p4,.p5{background:#fff;color:#000;border-color:#fff;animation:pu2 1s infinite alternate}
.p5{background:#000;color:#fff}
@keyframes pu2{to{box-shadow:0 0 14px #fff}}
.acts{display:flex;gap:8px}
.btn{padding:10px 16px;border-radius:11px;border:1px solid #fff;background:linear-gradient(#fff,#cfcfcf);color:#000;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center;transition:.12s;justify-content:center}
.btn.g{background:transparent;color:#fff;border-color:#666}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.95)}.btn:disabled{opacity:.35;cursor:default;transform:none}
.done{color:#9a9a9a;font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center}
.bulk{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pt{position:absolute;width:7px;height:7px;background:#fff;pointer-events:none;animation:pt .9s ease-out forwards;z-index:5}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) rotate(300deg);opacity:0}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
#flash.on{animation:fs .7s}
@keyframes fs{0%{opacity:.9}100%{opacity:0}}
.spins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sp{position:relative;overflow:hidden;padding:16px 10px;border-radius:16px;border:0;background:linear-gradient(145deg,#fff,#bdbdbd);color:#000;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s;font-size:18px;text-transform:uppercase;letter-spacing:.5px;box-shadow:0 8px 24px rgba(255,255,255,.14)}
.sp::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.9) 50%,transparent 60%);transform:translateX(-130%);animation:sw 3.2s infinite}
.sp small{font-size:12px;opacity:.7;font-weight:700;text-transform:none;letter-spacing:0}
.sp:hover{transform:translateY(-3px)}.sp:active{transform:scale(.97)}.sp:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}
.sp.x3{background:var(--glass);color:#fff;border:1.5px solid #fff;box-shadow:none}
.sp.x3::after{background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.25) 50%,transparent 60%)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px}
.stats b{display:block;font-size:15px;color:#fff;letter-spacing:0;margin-bottom:3px}
/* upgrader */
.wheel{position:relative;width:min(290px,76vw);margin:4px auto 0}
.wheel svg{width:100%;display:block;overflow:visible}
.wc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.wc b{font-size:42px;letter-spacing:-1px;line-height:1}.wc span{color:var(--mut);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-top:6px}
.wheel.win{animation:wg 1s}.wheel.lose{animation:sk .5s}
@keyframes wg{50%{filter:drop-shadow(0 0 30px #fff)}}
.rt{text-align:center;min-height:30px;font-weight:900;font-size:20px;text-transform:uppercase;letter-spacing:1px;margin:6px 0 10px}
.rt.in{animation:dr .4s both}
.lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin:12px 0 7px;display:flex;justify-content:space-between}
.lbl b{color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .btn{padding:8px 11px;font-size:12px;flex:1;min-width:52px}
.bet{display:flex;align-items:center;gap:8px;background:#080808;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.bet svg{color:var(--mut)}
.sl{position:relative;height:30px;touch-action:none;cursor:pointer}
.sl::before{content:"";position:absolute;left:0;right:0;top:12px;height:6px;border-radius:6px;background:#222}
.sf{position:absolute;left:0;top:12px;height:6px;border-radius:6px;background:linear-gradient(90deg,#666,#fff)}
.th{position:absolute;top:3px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.6)}
.go{width:100%;margin-top:14px;padding:16px;font-size:17px;text-transform:uppercase;letter-spacing:1px;border-radius:14px}
.info{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:12px;gap:8px;text-align:center}
.info b{color:#fff;display:block;font-size:16px;margin-top:2px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gh b{font-size:16px;text-transform:uppercase;letter-spacing:1px}
.gh div{display:flex;gap:8px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.gi{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);animation:dr .35s both}
.gi .pill{font-size:10px;padding:2px 9px}
.gi .btn{padding:7px 12px;font-size:12px}
.emp{color:var(--mut);text-align:center;padding:34px 0;font-size:14px;grid-column:1/-1}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
.mod.on{display:flex}
.mb{background:#0f0f0f;border:1px solid var(--line);border-radius:20px;padding:18px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;animation:dr .3s both}
.mb h2{margin:0 0 4px;font-size:18px;text-transform:uppercase;letter-spacing:1px}
.mb p{color:var(--mut);font-size:13px;margin:0 0 12px;line-height:1.4}
.or{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.or .pl{flex:1;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.or .pl span{color:var(--mut);font-size:12px}
.or .nm{text-align:right;font-weight:800;white-space:nowrap}
.or .nm small{display:block;color:var(--mut);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#fff;color:#000;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="car" viewBox="0 0 24 24"><path d="M5 11l1.6-4.4A2 2 0 0 1 8.5 5h7a2 2 0 0 1 1.9 1.6L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/></symbol>
<symbol id="rub" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 17V7h3.5a2.5 2.5 0 0 1 0 5H8M8 15h6"/></symbol>
<symbol id="on" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
<symbol id="lo" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></symbol>
<symbol id="off" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6M21 9l-5 6"/></symbol>
<symbol id="inf" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></symbol>
<symbol id="cash" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="gar" viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12M7 21v-7h10v7M7 17h10"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
<symbol id="up" viewBox="0 0 24 24"><path d="M12 20V6M5 12l7-7 7 7"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
</svg>

<div class="wrap">
<header>
  <div class="logo"><span class="mark"><svg class="i"><use href="#car"/></svg></span><span>Автономера</span></div>
  <button class="ib" id="reg" hidden></button>
  <div class="bal" id="bal"><svg class="i"><use href="#rub"/></svg><span id="balN">0</span></div>
  <button class="ib" id="snd"><svg class="i"><use href="#on"/></svg></button>
  <button class="ib" id="inf"><svg class="i"><use href="#inf"/></svg></button>
</header>

<section class="card" id="pick" hidden>
  <h2>Выберите регион</h2>
  <p>Все номера в игре будут с этим регионом.</p>
  <div class="rg" id="rg"></div>
</section>

<div id="game" hidden>
<div class="tabs">
  <button class="tab on" data-t="play"><svg class="i"><use href="#play"/></svg>Открыть</button>
  <button class="tab" data-t="up"><svg class="i"><use href="#up"/></svg>Апгрейд</button>
  <button class="tab" data-t="gar"><svg class="i"><use href="#gar"/></svg>Гараж<em id="gn">0</em></button>
</div>

<section id="play">
  <div class="rec" id="rec"></div>
  <div class="stage" id="stage">
    <div class="idle" id="idle"><svg class="i"><use href="#car"/></svg>Открывайте номера бесплатно.<br>Продавайте лучшие и играйте на деньги в апгрейде.</div>
    <div class="slots" id="slots"></div>
    <div class="bulk" id="bulk" hidden></div>
  </div>
  <div class="spins">
    <button class="sp" id="s1">Открыть ×1<small>Бесплатно</small></butto
